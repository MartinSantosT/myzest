version: '3.8'

services:
  zest:
    build: .
    container_name: zest
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./app/static/uploads:/app/app/static/uploads
    environment:
      - PYTHONUNBUFFERED=1
      - ZEST_SECRET_KEY=${ZEST_SECRET_KEY:-zest-change-this-secret-in-production}
      # Optional: set to "true" to allow the recipe scraper to fetch URLs
      # in private IP ranges (10.x, 172.16.x, 192.168.x). Off by default
      # for security. See README and .env.example for details.
      - ALLOW_PRIVATE_NETWORKS=${ALLOW_PRIVATE_NETWORKS:-false}
